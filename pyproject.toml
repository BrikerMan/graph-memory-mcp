[project]
name = "bm-graph-memory-mcp"
version = "0.1.0"
description = "A persistent, indexed knowledge graph for AI agents, designed for MCP-compatible platforms"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi[standard]>=0.116.2",
    "pydantic>=2.11.9",
    "uvicorn[standard]>=0.27.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3.2",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
